[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsuetrssfeed"
version = "0.0.1"
description = "Генерирует rss ленту новостей для сайта vsuet.ru"
authors = [
    { name = "trueold89", email = "trueold89@orudo.ru" }
]
dependencies = [
  "fastapi>=0.115.12",
  "pydantic>=2.11.5",
  "pydantic-settings>=2.9.1",
  "pydantic_core>=2.33.2",
  "redis>=6.2.0",
  "uvicorn>=0.34.3",
  "gunicorn>=23.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11.12",
]
